# ---------------------------------------------------------------------------
# fix_generation (5 cases)
# ---------------------------------------------------------------------------

- id: sentry-v7-startTransaction-fix
  category: fix_generation
  verified: false
  description: >
    perf.js uses the v7 startTransaction API; fix must replace
    Sentry.startTransaction() with Sentry.startSpan() using the callback
    pattern and remove the explicit transaction.finish() calls.
  fixture: sentry_v7_project
  target_file: src/perf.js
  breaking_change:
    package: "@sentry/node"
    old_version: "7.119.0"
    new_version: "8.0.0"
    old_api: "sentry.startTransaction"
    new_api: "sentry.startSpan"
    description: >
      Sentry v8 replaces startTransaction() with startSpan(), which uses a
      callback pattern where the span auto-finishes when the callback returns.
      The explicit .finish() call is no longer needed.
    migration_guide: >
      Replace `Sentry.startTransaction({ name, op })` with
      `Sentry.startSpan({ name, op }, (span) => { ... })`. Move the body of
      the transaction into the callback. Remove all `.finish()` calls.
    kind: method_renamed
    source: manual
    provider_id: sentry
    confidence: 0.9
    examples:
      - - |
          const transaction = Sentry.startTransaction({ name: 'process-order', op: 'task' });
          transaction.setStatus('ok');
          transaction.finish();
        - |
          Sentry.startSpan({ name: 'process-order', op: 'task' }, (span) => {
            span.setStatus({ code: 1 });
          });
  fix_assertion:
    must_contain:
      - "startSpan"
    must_not_contain:
      - "startTransaction"
    max_changed_line_ratio: 0.8

- id: sentry-v7-getCurrentHub-fix
  category: fix_generation
  verified: false
  description: >
    hub.js calls Sentry.getCurrentHub().configureScope() to set tags/user;
    fix must replace with getCurrentScope() and direct scope mutation.
  fixture: sentry_v7_project
  target_file: src/hub.js
  breaking_change:
    package: "@sentry/node"
    old_version: "7.119.0"
    new_version: "8.0.0"
    old_api: "sentry.getCurrentHub"
    new_api: "sentry.getCurrentScope"
    description: >
      Sentry v8 removes getCurrentHub() in favour of getCurrentScope().
      The Hub concept is replaced by the Scope hierarchy; scope methods
      are called directly on the scope object returned by getCurrentScope().
    migration_guide: >
      Replace `Sentry.getCurrentHub()` with `Sentry.getCurrentScope()`.
      The scope object returned has the same setTag/setUser API.
      Remove the intermediate `.configureScope()` wrapper.
    kind: method_renamed
    source: manual
    provider_id: sentry
    confidence: 0.9
    examples:
      - - |
          const hub = Sentry.getCurrentHub();
          hub.configureScope((scope) => { scope.setTag('region', region); });
        - |
          const scope = Sentry.getCurrentScope();
          scope.setTag('region', region);
  fix_assertion:
    must_contain:
      - "getCurrentScope"
    must_not_contain:
      - "getCurrentHub"
    max_changed_line_ratio: 0.7

