- id: sentry-v7-captureException-fix
  category: fix_generation
  verified: false
  description: >
    breadcrumbs.js passes a scope-data object as the second arg to
    captureException(); v8 deprecates this in favour of withScope().
    Fix must wrap the call in Sentry.withScope() and set scope data before
    the captureException call.
  fixture: sentry_v7_project
  target_file: src/breadcrumbs.js
  breaking_change:
    package: "@sentry/node"
    old_version: "7.119.0"
    new_version: "8.0.0"
    old_api: "sentry.captureException"
    new_api: "sentry.withScope"
    description: >
      Sentry v8 deprecates passing scope context as the second argument to
      captureException(). Use withScope() to set user, extras, and tags on
      the current isolation scope before capturing.
    migration_guide: >
      Replace `Sentry.captureException(err, { extra, user, tags })` with
      `Sentry.withScope((scope) => { scope.setExtra(...); scope.setUser(...);
      scope.setTag(...); Sentry.captureException(err); })`.
    kind: param_type_changed
    source: manual
    provider_id: sentry
    confidence: 0.85
    examples:
      - - |
          Sentry.captureException(err, {
            extra: { requestId },
            user: { id: userId },
            tags: { component: 'checkout' }
          });
        - |
          Sentry.withScope((scope) => {
            scope.setExtra('requestId', requestId);
            scope.setUser({ id: userId });
            scope.setTag('component', 'checkout');
            Sentry.captureException(err);
          });
  fix_assertion:
    must_contain:
      - "withScope"
    must_not_contain: []
    max_changed_line_ratio: 0.8

