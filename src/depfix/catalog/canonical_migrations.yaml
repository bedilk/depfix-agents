# Canonical migrations cover historical breaks a new depfix installation
# cannot observe through a first upstream poll. Feed IDs are stable, making
# every catalog migration idempotent through the normal watcher cursor.
providers:
  - id: openai
    sdk_packages: [{name: openai, ecosystem: npm}]
    call_site_anchors: ["sdk.createChatCompletion("]
    feeds:
      - kind: fixture_change
        id: openai-v3-v4-canonical
        old_token: "3.3.0"
        new_token: "4.0.1"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: openai.createChatCompletion
            after: openai.chat.completions.create
            detail: OpenAI v4 migration. Configuration and OpenAIApi classes removed; use new OpenAI({ apiKey }) directly.
          - kind: operation_id_changed
            severity: breaking
            subject: openai.createCompletion
            after: openai.completions.create
            detail: OpenAI v4 migration. Configuration and OpenAIApi classes removed; use new OpenAI({ apiKey }) directly.
          - kind: operation_id_changed
            severity: breaking
            subject: openai.createEmbedding
            after: openai.embeddings.create
            detail: OpenAI v4 migration. Configuration and OpenAIApi classes removed; use new OpenAI({ apiKey }) directly.
          - kind: operation_id_changed
            severity: breaking
            subject: openai.createModeration
            after: openai.moderations.create
            detail: OpenAI v4 migration. Configuration and OpenAIApi classes removed; use new OpenAI({ apiKey }) directly.
          - kind: operation_id_changed
            severity: breaking
            subject: openai.createImage
            after: openai.images.generate
            detail: OpenAI v4 migration. Configuration and OpenAIApi classes removed; use new OpenAI({ apiKey }) directly.
          - kind: operation_id_changed
            severity: breaking
            subject: openai.createEdit
            after: openai.edits.create
            detail: OpenAI v4 migration. Configuration and OpenAIApi classes removed; use new OpenAI({ apiKey }) directly.

  - id: stripe
    sdk_packages: [{name: stripe, ecosystem: npm}]
    call_site_anchors: ["sdk.charges.create("]
    feeds:
      - kind: fixture_change
        id: stripe-v12-v13
        old_token: "12.0.0"
        new_token: "13.0.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: stripe.charges.create
            after: stripe.paymentIntents.create
            detail: Stripe Charges migration.
          - kind: operation_id_changed
            severity: breaking
            subject: stripe.charges.retrieve
            after: stripe.paymentIntents.retrieve
            detail: Stripe Charges migration.
          - kind: operation_id_changed
            severity: breaking
            subject: stripe.charges.list
            after: stripe.paymentIntents.list
            detail: Stripe Charges migration.

  - id: anthropic
    sdk_packages: [{name: "@anthropic-ai/sdk", ecosystem: npm}]
    call_site_anchors: ["sdk.completions.create("]
    feeds:
      - kind: fixture_change
        id: anthropic-completions-messages
        old_token: "0.8.0"
        new_token: "0.9.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: anthropic.completions.create
            after: anthropic.messages.create
            detail: Anthropic Messages migration.

  - id: supabase
    sdk_packages: [{name: "@supabase/supabase-js", ecosystem: npm}]
    call_site_anchors: ["sdk.auth.signIn("]
    feeds:
      - kind: fixture_change
        id: supabase-v1-v2
        old_token: "1.0.0"
        new_token: "2.0.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: supabase.auth.signIn
            after: supabase.auth.signInWithPassword
            detail: Supabase auth migration.

  - id: vercel-ai
    sdk_packages: [{name: ai, ecosystem: npm}]
    call_site_anchors: ["sdk.generateText("]
    feeds:
      - kind: fixture_change
        id: vercel-ai-v2-v3
        old_token: "2.0.0"
        new_token: "3.0.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: vercel-ai.generateText
            after: vercel-ai.streamText
            detail: Vercel AI migration.

  - id: sentry
    sdk_packages: [{name: "@sentry/node", ecosystem: npm}]
    call_site_anchors: ["sdk.Integrations.Http("]
    feeds:
      - kind: fixture_change
        id: sentry-v7-v8
        old_token: "7.0.0"
        new_token: "8.0.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: sentry.Integrations.Http
            after: sentry.httpIntegration
            detail: Sentry integration migration.

  - id: mongodb
    sdk_packages: [{name: mongodb, ecosystem: npm}]
    call_site_anchors: ["sdk.findOne("]
    feeds:
      - kind: fixture_change
        id: mongodb-v4-v5
        old_token: "4.0.0"
        new_token: "5.0.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: mongodb.findOne
            after: mongodb.findOneAsync
            detail: MongoDB callback migration.

  # The following records are intentionally small, documented migrations.
  # They provide a safe seed for the newly supported providers; broader API
  # changes should be added only after an upstream migration guide and a
  # regression fixture are available.
  - id: google-cloud
    sdk_packages: [{name: "@google-cloud/storage", ecosystem: npm}]
    call_site_anchors: []
    feeds:
      - kind: fixture_change
        id: google-cloud-storage-node-runtime
        old_token: "6.0.0"
        new_token: "7.0.0"
        spec_changes:
          - kind: operation_deprecated
            severity: breaking
            subject: node.runtime
            after: node.runtime
            detail: "The Google Cloud Node.js client major line may raise its minimum supported Node.js runtime; review engines and deployment images manually."

  - id: elasticsearch
    sdk_packages: [{name: "@elastic/elasticsearch", ecosystem: npm}]
    call_site_anchors: ["client.search(", "new Client("]
    feeds:
      - kind: fixture_change
        id: elasticsearch-js-v7-v8
        old_token: "7.17.0"
        new_token: "8.0.0"
        spec_changes:
          - kind: operation_removed
            severity: breaking
            subject: elasticsearch.client.search.callback
            after: elasticsearch.client.search.promise
            detail: "The v8 JavaScript client removed callback-style API calls; use the promise/async API."
          - kind: param_renamed
            severity: breaking
            subject: elasticsearch.client.search.body
            after: elasticsearch.client.search.query
            detail: "The v8 client promotes request fields such as query to the request root instead of nesting them under body."
          - kind: param_renamed
            severity: breaking
            subject: elasticsearch.Client.ssl
            after: elasticsearch.Client.tls
            detail: "The client option ssl was renamed to tls in v8."

  - id: postgresql
    sdk_packages: [{name: pg, ecosystem: npm}]
    call_site_anchors: ["pg.connect(", "new pg.Pool(", "new Client("]
    feeds:
      - kind: fixture_change
        id: node-postgres-v6-v7
        old_token: "6.3.0"
        new_token: "7.0.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: pg.connect
            after: pg.Pool.connect
            detail: "The deprecated singleton pg.connect/pg.end API was removed; create and manage a pg.Pool."
      - kind: fixture_change
        id: node-postgres-v7-v8-ssl
        old_token: "7.0.0"
        new_token: "8.0.0"
        spec_changes:
          - kind: param_type_changed
            severity: breaking
            subject: pg.Client.ssl.true
            after: pg.Client.ssl.rejectUnauthorized.false
            detail: "Self-signed SSL connections need ssl: { rejectUnauthorized: false } instead of ssl: true."

  - id: kafka
    sdk_packages: [{name: kafkajs, ecosystem: npm}]
    call_site_anchors: ["Partitioners.JavaCompatiblePartitioner", "Partitioners.DefaultPartitioner"]
    feeds:
      - kind: fixture_change
        id: kafkajs-v1-v2-partitioners
        old_token: "1.16.0"
        new_token: "2.0.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: kafkajs.Partitioners.JavaCompatiblePartitioner
            after: kafkajs.Partitioners.DefaultPartitioner
            detail: "KafkaJS v2 renamed JavaCompatiblePartitioner to DefaultPartitioner."
          - kind: operation_id_changed
            severity: breaking
            subject: kafkajs.Partitioners.DefaultPartitioner
            after: kafkajs.Partitioners.LegacyPartitioner
            detail: "KafkaJS v2 renamed the previous default partitioner to LegacyPartitioner."

  - id: rabbitmq
    sdk_packages: [{name: pika, ecosystem: pypi}]
    call_site_anchors: ["basic_publish(", "BlockingConnection(", "SSLOptions("]
    feeds:
      - kind: fixture_change
        id: pika-v0-13-v1
        old_token: "0.13.0"
        new_token: "1.0.0"
        spec_changes:
          - kind: operation_id_changed
            severity: breaking
            subject: pika.publish
            after: pika.basic_publish
            detail: "Pika 1.0 removed the legacy basic_publish alias and standardized on basic_publish."
          - kind: param_type_changed
            severity: breaking
            subject: pika.ConnectionParameters.ssl_options.dict
            after: pika.SSLOptions
            detail: "Pika 1.0 requires the SSLOptions class for TLS options instead of a dictionary."
