    url: https://docs.anthropic.com/en/release-notes/api
  - kind: ts_exports_diff
    package: '@anthropic-ai/sdk'
  - kind: fixture_change
    id: anthropic-sdk-stream-api-0.20-0.131
    package: '@anthropic-ai/sdk'
    old_token: 0.20.9
    new_token: 0.131.0
    spec_changes:
    - kind: operation_id_changed
      severity: breaking
      subject: anthropic.messages.create
      after: anthropic.messages.stream
      detail: 'Replace streaming calls: const stream = client.messages.stream({model,
        max_tokens, messages}); const msg = await stream.finalMessage(); For non-streaming,
        messages.create() is unchanged. messages.stream() returns a MessageStream
        — call .finalMessage() to get the completed Message, or iterate with for-await
        for incremental events.

        '
