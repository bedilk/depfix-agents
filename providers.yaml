    ecosystem: rubygems
  feeds:
  - kind: npm_dist_tag
    package: pg
    dist_tag: latest
    github_repo: brianc/node-postgres
  - kind: pypi_dist_tag
    package: psycopg
    github_repo: psycopg/psycopg
  - kind: github_release
    repo: brianc/node-postgres
  - kind: rubygems_dist_tag
    gem: pg
  - kind: security_advisory
    package: pg
    ecosystem: npm
  - kind: security_advisory
    package: psycopg
    ecosystem: pypi
  - kind: changelog_html
    url: https://node-postgres.com/announcements
  - kind: ts_exports_diff
    package: pg
  - kind: fixture_change
    id: pg-8-pool-query-to-connect-8.16-8.23
    package: pg
    old_token: 8.16.3
    new_token: 8.23.1
    spec_changes:
    - kind: operation_id_changed
      severity: breaking
      subject: postgresql.Pool
      after: pg.Pool
      detail: 'In pg ≥8.23, prefer named imports: import { Pool } from ''pg'' instead
        of the default import pattern. Also use explicit pool.connect() + client.release()
        for transaction safety.

        '
    - kind: operation_id_changed
      severity: breaking
      subject: postgresql.query
      after: postgresql.execute
      detail: 'In pg ≥8.23, pool.execute() (aliased from query) provides clearer intent
        for parameterised statements with typed results.

        '
