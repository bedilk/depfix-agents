  - id: postgresql
    name: PostgreSQL Client Libraries
    api_version_scheme: semver
    api_base_urls:
      - https://www.postgresql.org
    sdk_packages:
      - name: pg
        ecosystem: npm
      - name: psycopg
        ecosystem: pypi
    call_site_anchors:
      - "new Pool("
      - "pool.query("
      - "new Client("
      - "client.query("
      - "psycopg.connect("
    feeds:
      - kind: npm_dist_tag
        package: pg
        dist_tag: latest
        github_repo: brianc/node-postgres
      - kind: pypi_dist_tag
        package: psycopg
        github_repo: psycopg/psycopg
      - kind: github_release
        repo: brianc/node-postgres

  - id: kafka
    name: Apache Kafka Clients
    api_version_scheme: semver
    api_base_urls:
      - https://kafka.apache.org
    sdk_packages:
      - name: kafkajs
        ecosystem: npm
      - name: kafka-python
        ecosystem: pypi
    call_site_anchors:
      - "new Kafka("
      - "producer.send("
      - "consumer.run("
      - "KafkaProducer("
      - "KafkaConsumer("
    feeds:
      - kind: npm_dist_tag
        package: kafkajs
        dist_tag: latest
        github_repo: tulios/kafkajs
      - kind: pypi_dist_tag
        package: kafka-python
        github_repo: dpkp/kafka-python
      - kind: github_release
        repo: tulios/kafkajs

  - id: rabbitmq
    name: RabbitMQ Clients
    api_version_scheme: semver
    api_base_urls:
      - https://www.rabbitmq.com
    sdk_packages:
      - name: amqplib
        ecosystem: npm
      - name: pika
        ecosystem: pypi
    call_site_anchors:
      - "amqp.connect("
      - "channel.assertQueue("
      - "channel.sendToQueue("
      - "pika.BlockingConnection("
      - "channel.basic_publish("
    feeds:
      - kind: npm_dist_tag
        package: amqplib
        dist_tag: latest
        github_repo: amqp-node/amqplib
      - kind: pypi_dist_tag
        package: pika
        github_repo: pika/pika
      - kind: github_release
        repo: amqp-node/amqplib
