      - "posthog.capture("
      - "posthog.identify("
    feeds:
      - kind: npm_dist_tag
        package: posthog-node
        dist_tag: latest
        github_repo: PostHog/posthog-js
      - kind: github_release
        repo: PostHog/posthog-js

  - id: algolia
    name: Algolia JavaScript Client
    api_version_scheme: semver
    sdk_packages:
      - name: algoliasearch
        ecosystem: npm
    call_site_anchors:
      - "algoliasearch("
      - "searchClient.search("
      - "initIndex("
    feeds:
      - kind: npm_dist_tag
        package: algoliasearch
        dist_tag: latest
        github_repo: algolia/algoliasearch-client-javascript
      - kind: github_release
        repo: algolia/algoliasearch-client-javascript

  # Additional cross-ecosystem providers for broader drift and migration
  # testing. Candidate repositories are documented in
  # docs/research/additional-provider-test-repos.md.
  - id: google-cloud
    name: Google Cloud Client Libraries
    api_version_scheme: semver
    api_base_urls:
      - https://storage.googleapis.com
    sdk_packages:
      - name: "@google-cloud/storage"
        ecosystem: npm
      - name: google-cloud-storage
        ecosystem: pypi
    call_site_anchors:
      - "new Storage("
      - "storage.bucket("
      - "bucket.file("
      - "new GoogleAuth("
      - "google.cloud.storage"
    feeds:
      - kind: npm_dist_tag
        package: "@google-cloud/storage"
        dist_tag: latest
        github_repo: googleapis/nodejs-storage
      - kind: pypi_dist_tag
        package: google-cloud-storage
        github_repo: googleapis/python-storage
      - kind: github_release
        repo: googleapis/nodejs-storage

  - id: elasticsearch
